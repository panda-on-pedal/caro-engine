<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Caro</title>
  <style>
    :root {
      --paper: #f6f1e4;
      --cell-paper: #fbf8f0;
      --rule-blue: #b9cfe8;
      --pen-red: #c4433f;
      --ink-blue: #2f5d9c;
      --graphite: #33312e;
      --muted: #6b6a63;
      --highlighter: #f6d65a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      grid-template-columns: 72px max-content 1fr;
      align-items: start;
      column-gap: 20px;
      padding: 0px 24px 56px 0;
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--graphite);
      background-color: var(--paper);
      background-image:
        linear-gradient(to right, transparent 0 55px, var(--pen-red) 55px 57px, transparent 57px),
        linear-gradient(to right, var(--rule-blue) 1px, transparent 1px),
        linear-gradient(to bottom, var(--rule-blue) 1px, transparent 1px);
      background-size:
        100% 100%,
        var(--cell-size, 28px) var(--cell-size, 28px),
        var(--cell-size, 28px) var(--cell-size, 28px);
    }

    .margin-col {
      grid-column: 1;
    }

    .logo-col {
      grid-column: 2;
      padding-top: 4px;
    }

    main {
      grid-column: 3;
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-width: 0;
    }

    .titlebar {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    #title {
      position: relative;
      margin: 0;
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 3rem;
      font-weight: 400;
      color: var(--ink-blue);
      transform: rotate(-2deg);
    }

    #title::after {
      content: "";
      position: absolute;
      left: 2px;
      right: 8px;
      bottom: -2px;
      height: 10px;
      border-bottom: 3px solid var(--pen-red);
      border-radius: 50%;
      opacity: 0.75;
      transform: rotate(-1deg);
    }

    .subtitle {
      margin: 0;
      font-family: "Consolas", "SFMono-Regular", Menlo, monospace;
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #status {
      font-size: 1.05rem;
      min-height: 1.4em;
      margin: 0;
    }

    #status[data-done] {
      font-weight: 600;
      padding: 0 4px;
      background-image: linear-gradient(180deg, transparent 60%, var(--highlighter) 60%);
    }

    #status-detail {
      margin: -4px 0 0;
      max-height: 9.5em;
      overflow-y: auto;
      font-size: 0.85rem;
      line-height: 1.35;
      color: var(--muted);
      white-space: pre-line;
    }

    #status-detail[data-severity="error"] {
      color: var(--pen-red);
    }

    #status-detail[hidden] {
      display: none;
    }

    #tab-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: var(--cell-size, 28px);
      margin-left: var(--cell-size, 28px);
    }

    #tab-strip[hidden] {
      display: none;
    }

    .tab-button {
      padding: 4px 10px;
      font-family: inherit;
      font-size: 0.8rem;
      color: var(--graphite);
      background: var(--cell-paper);
      border: 2px solid var(--graphite);
      border-radius: 3px 3px 0 0;
      cursor: pointer;
    }

    .tab-button:hover {
      background: #f1ead8;
    }

    .tab-button[data-active="true"] {
      background-image: linear-gradient(180deg, transparent 55%, var(--highlighter) 55%);
      font-weight: 600;
    }

    .tab-button[data-status="thinking"]::after {
      content: " •";
      color: var(--ink-blue);
    }

    .tab-button[data-status="restarting"]::after {
      content: " •";
      color: var(--pen-red);
    }

    .tab-button-results {
      margin-left: 8px;
      padding-left: 14px;
      border-left: 2px dashed var(--muted);
    }

    .play-row {
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    .board-column {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }

    .board-column[hidden] {
      display: none;
    }

    #board-grid {
      display: grid;
      grid-template-columns: auto auto;
      grid-template-rows: auto auto;
    }

    #matchup {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      align-self: stretch;
      margin: 0 0 0 var(--cell-size, 28px);
      font-family: "Consolas", "SFMono-Regular", Menlo, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.02em;
      color: var(--muted);
    }

    .matchup-side[data-player="1"] {
      color: var(--ink-blue);
    }

    .matchup-side[data-player="2"] {
      color: var(--pen-red);
    }

    .matchup-vs {
      flex: 0 0 auto;
      width: 16px;
      height: 16px;
      color: var(--graphite);
      opacity: 0.7;
    }

    #board-corner {
      width: var(--cell-size, 28px);
      height: var(--cell-size, 28px);
    }

    #col-headers,
    #row-headers {
      display: grid;
    }

    .header-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Consolas", "SFMono-Regular", Menlo, monospace;
      font-size: 9px;
      color: var(--muted);
    }

    #board {
      display: grid;
      gap: 0;
      background-color: var(--paper);
      background-image:
        linear-gradient(to right, var(--rule-blue) 1px, transparent 1px),
        linear-gradient(to bottom, var(--rule-blue) 1px, transparent 1px);
      background-size: var(--cell-size, 28px) var(--cell-size, 28px);
      border: 2px solid var(--graphite);
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.08);
    }

    .cell {
      width: var(--cell-size, 28px);
      height: var(--cell-size, 28px);
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      color: inherit;
      font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
      font-size: 19px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .cell:not(:disabled):hover {
      background: rgba(47, 93, 156, 0.14);
    }

    .cell:disabled {
      cursor: default;
    }

    .cell[data-player="1"] {
      color: var(--ink-blue);
    }

    .cell[data-player="2"] {
      color: var(--pen-red);
    }

    .mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 78%;
      height: 78%;
      border-radius: 50%;
      transition: box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .mark[data-winning-cell="true"] {
      font-weight: 700;
      background-color: rgba(246, 214, 90, 0.65);
    }

    .mark[data-last-move="true"] {
      background-color: rgba(246, 214, 90, 0.9);
    }

    .cell[data-thinking="true"] {
      background-color: rgba(47, 93, 156, 0.12);
    }

    .cell[data-thinking="true"] .mark:not([data-last-move]):not([data-winning-cell]) {
      box-shadow: inset 0 0 0 2px rgba(47, 93, 156, 0.35);
    }

    .cell:focus {
      outline: none;
    }

    .cell:focus-visible {
      outline: 2px solid var(--ink-blue);
      outline-offset: -2px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
      width: 170px;
      margin-top: var(--cell-size, 28px);
    }

    .controls[hidden] {
      display: none;
    }

    #stats-panel[hidden] {
      display: none;
    }

    #new-game,
    #undo,
    #redo,
    #pause,
    #ascii-toggle,
    #settings-open,
    #settings-back {
      padding: 10px 20px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--graphite);
      background: var(--cell-paper);
      border: 2px solid var(--graphite);
      border-radius: 3px 3px 0 0;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
      cursor: pointer;
    }

    #settings-panel {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
      min-width: min(320px, 100%);
      margin-top: var(--cell-size, 28px);
      margin-left: var(--cell-size, 28px);
    }

    #settings-panel[hidden] {
      display: none;
    }

    #settings-panel h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--graphite);
    }

    .settings-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.95rem;
      color: var(--graphite);
      cursor: pointer;
    }

    .settings-row input {
      margin-top: 3px;
    }

    #new-game:hover,
    #undo:hover:not(:disabled),
    #redo:hover:not(:disabled),
    #pause:hover:not(:disabled),
    #ascii-toggle:hover {
      background: #f1ead8;
    }

    #new-game:active,
    #undo:active:not(:disabled),
    #redo:active:not(:disabled),
    #pause:active:not(:disabled),
    #ascii-toggle:active {
      box-shadow: 1px 1px 0 rgba(0, 0, 0, 0.1);
      transform: translate(2px, 2px);
    }

    #new-game:focus-visible,
    #undo:focus-visible,
    #redo:focus-visible,
    #pause:focus-visible,
    #ascii-toggle:focus-visible {
      outline: 2px solid var(--ink-blue);
      outline-offset: 2px;
    }

    #undo:disabled,
    #redo:disabled,
    #pause:disabled {
      opacity: 0.45;
      cursor: default;
      box-shadow: none;
    }

    #lang,
    #game-mode,
    #difficulty,
    #board-count {
      padding: 8px 10px;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--graphite);
      background: var(--cell-paper);
      border: 2px solid var(--graphite);
      border-radius: 3px;
    }

    #stats-panel {
      min-width: 560px;
    }

    #stats-panel .stats-section {
      margin-bottom: 1.1rem;
    }

    #stats-panel .stats-section h3 {
      margin: 0 0 0.45rem;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
    }

    #stats-panel .stats-summary {
      margin: 0;
      font-size: 0.9rem;
    }

    #stats-panel table {
      border-collapse: collapse;
      font-size: 0.85rem;
      background: var(--cell-paper);
    }

    #stats-panel th,
    #stats-panel td {
      padding: 4px 10px;
      border: 1px solid var(--rule-blue);
      text-align: right;
    }

    #stats-panel th:first-child,
    #stats-panel td:first-child {
      text-align: left;
    }

    #stats-panel .stats-hint {
      margin: 10px 0 0;
      max-width: 42rem;
      font-size: 0.8rem;
      line-height: 1.4;
      color: var(--graphite);
      opacity: 0.85;
    }

    #ascii-panel {
      width: 100%;
      max-width: 480px;
      margin-left: var(--cell-size, 28px);
    }

    #ascii-text {
      width: 100%;
      height: 260px;
      padding: 10px;
      font-family: "Consolas", "SFMono-Regular", Menlo, monospace;
      font-size: 12px;
      line-height: 1.35;
      white-space: pre;
      color: var(--graphite);
      background: var(--cell-paper);
      border: 2px solid var(--graphite);
      border-radius: 3px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <div class="margin-col"></div>
  <aside class="logo-col">
    <div class="titlebar">
      <h1 id="title" data-i18n="title">Caro</h1>
      <p class="subtitle" data-i18n="subtitle">Five in a row</p>
    </div>
  </aside>
  <main>
    <div id="tab-strip" hidden></div>
    <div class="play-row">
      <div id="board-column" class="board-column">
        <div id="board-grid">
          <div id="board-corner"></div>
          <div id="col-headers"></div>
          <div id="row-headers"></div>
          <div id="board"></div>
        </div>
        <p id="matchup">
          <span id="matchup-p1" class="matchup-side" data-player="1">Human (X)</span>
          <svg class="matchup-vs" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path
              d="M3.1 3.4c2.4 2.1 5.1 4.6 9.6 9.2"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
            <path
              d="M12.7 3.2c-2.3 2.4-5 5-9.4 9.5"
              fill="none"
              stroke="currentColor"
              stroke-width="1.4"
              stroke-linecap="round"
            />
          </svg>
          <span id="matchup-p2" class="matchup-side" data-player="2">Computer (O)</span>
        </p>
      </div>
      <div id="settings-panel" hidden>
        <h2 data-i18n="settings.title">Settings</h2>
        <label class="settings-row">
          <input id="pref-highlight-thinking" type="checkbox" checked />
          <span data-i18n="settings.highlightWhileThinking">Highlight cells while thinking</span>
        </label>
        <button id="settings-back" type="button" data-i18n="settings.back">Back</button>
      </div>
      <div id="stats-panel" hidden></div>
      <div id="controls" class="controls">
        <select id="game-mode">
          <option value="human-ai" selected data-i18n="mode.humanAi">Human vs Computer</option>
          <option value="ai-human" data-i18n="mode.aiHuman">Computer vs Human</option>
          <option value="ai-ai" data-i18n="mode.aiAi">Tournament</option>
        </select>
        <select id="difficulty">
          <option value="easy" data-i18n="difficulty.easy">Easy</option>
          <option value="medium" data-i18n="difficulty.medium">Medium</option>
          <option value="hard" selected data-i18n="difficulty.hard">Hard</option>
          <option value="expert" data-i18n="difficulty.expert">Expert</option>
        </select>
        <select id="board-count" hidden></select>
        <button id="pause" type="button" hidden data-i18n="controls.pause">Pause</button>
        <button id="undo" type="button" disabled data-i18n="controls.undo">Undo</button>
        <button id="redo" type="button" disabled data-i18n="controls.redo">Redo</button>
        <button id="new-game" type="button" data-i18n="controls.newGame">New Game</button>
        <select id="lang" aria-label="Language">
          <option value="en" data-i18n="lang.en">English</option>
          <option value="vi" data-i18n="lang.vi">Tiếng Việt</option>
        </select>
        <button id="ascii-toggle" type="button" data-i18n="controls.showAscii">Show ASCII</button>
        <button id="settings-open" type="button" data-i18n="settings.open">Settings</button>
        <p id="status" data-i18n="status.loading">Loading&hellip;</p>
        <p id="status-detail" hidden></p>
      </div>
    </div>
    <div id="ascii-panel" hidden>
      <textarea id="ascii-text" readonly spellcheck="false"></textarea>
    </div>
  </main>
  <script src="main.js"></script>
</body>
</html>
