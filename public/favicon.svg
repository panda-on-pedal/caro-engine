<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Caro">
  <!-- Paper background + board border (matches UI tokens) -->
  <rect width="32" height="32" fill="#f6f1e4"/>
  <rect x="1.5" y="1.5" width="29" height="29" fill="none" stroke="#33312e" stroke-width="2"/>
  <!-- 2x2 grid -->
  <path stroke="#b9cfe8" stroke-width="1.5" d="M16 2v28M2 16h28"/>
  <!-- X (player 1 / ink-blue) -->
  <path
    stroke="#2f5d9c"
    stroke-width="2.4"
    stroke-linecap="round"
    d="M6.5 6.5l7 7m0-7l-7 7"
  />
  <!-- O (player 2 / pen-red) -->
  <circle cx="23.5" cy="23.5" r="4.6" fill="none" stroke="#c4433f" stroke-width="2.4"/>
</svg>
